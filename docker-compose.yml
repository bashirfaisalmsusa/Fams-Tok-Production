services:
  famstok:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./server:/app/server
      - ./web:/app/web
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      DB_FILE: /app/server/data/famstok.db
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    ports:
      - "4000:4000"
    command: sh -c "mkdir -p /app/server/data /app/server/uploads && npm install --prefix /app/server && npm --prefix /app/server start"
